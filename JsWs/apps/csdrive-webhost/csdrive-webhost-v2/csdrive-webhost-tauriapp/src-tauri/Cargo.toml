[package]
name = "csdrive-webhost-tauriapp"
version = "0.1.0"
description = "CsDrive WebHost - serves a user-provided index.html as the app UI"
edition = "2021"

[lib]
# staticlib/cdylib are what the Android/iOS builds link; rlib is for the desktop binary and tests.
name = "csdrive_webhost_tauriapp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aes-gcm = "0.11.1"
argon2 = "0.5"
base64 = "0.23.1"
hex = "0.4"
hmac = "0.12"
libsqlite3-sys = "0.30"
pbkdf2 = "0.12"
percent-encoding = "2"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha1 = "0.10"
sha2 = "0.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "=0.8.6", features = ["sqlite", "runtime-tokio"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.7.3"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1.26.1", features = ["v4"] }
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
keyring = "4.2.0"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
