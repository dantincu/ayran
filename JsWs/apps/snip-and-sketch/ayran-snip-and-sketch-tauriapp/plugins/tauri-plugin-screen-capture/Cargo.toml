[package]
name = "tauri-plugin-screen-capture"
version = "0.1.0"
edition = "2021"
description = "Native full-screen capture via Android MediaProjection"
license = "MIT"
links = "tauri-plugin-screen-capture"

[lib]
name = "tauri_plugin_screen_capture"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
