<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ayran Image Editor</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="icon" href="icon.png" type="image/png" sizes="256x256">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="menubar">
    <div class="group">
      <button data-action="new" title="New image (Ctrl+N)">New</button>
      <button data-action="open" title="Open an image (Ctrl+O) — you can also drop or paste one">Open</button>
      <button data-action="save" title="Save as PNG (Ctrl+S)">Save PNG</button>
    </div>
    <div class="group">
      <button data-action="undo" id="btn-undo" title="Undo (Ctrl+Z)" disabled>Undo</button>
      <button data-action="redo" id="btn-redo" title="Redo (Ctrl+Y)" disabled>Redo</button>
    </div>
    <div class="group">
      <button data-action="resize" title="Resize the image or the canvas">Resize</button>
      <button data-action="crop" id="btn-crop" title="Crop to the selection" disabled>Crop</button>
      <button data-action="flipH" title="Flip horizontally">Flip ↔</button>
      <button data-action="flipV" title="Flip vertically">Flip ↕</button>
      <button data-action="rotCW" title="Rotate 90° clockwise">Rotate ↻</button>
    </div>
    <div class="group">
      <button data-action="removeBg" class="accent" title="Detect the background color, confirm it, then remove it">Remove background</button>
    </div>
    <div class="group zoom">
      <button data-action="zoomOut" title="Zoom out (Ctrl+−)">−</button>
      <span id="zoom-label">100%</span>
      <button data-action="zoomIn" title="Zoom in (Ctrl++)">+</button>
      <button data-action="zoomFit" title="Fit to window (Ctrl+0)">Fit</button>
      <button data-action="zoom100" title="Actual size (Ctrl+1)">1:1</button>
    </div>
  </header>

  <div class="main">
    <aside class="toolbox">
      <div class="tools" role="toolbar" aria-label="Tools">
        <button data-tool="select" title="Select (S) — drag to select, drag inside to move, Del to clear">
          <svg viewBox="0 0 20 20"><rect x="3" y="3" width="14" height="14" stroke-dasharray="2.5 2"/></svg></button>
        <button data-tool="pencil" title="Pencil (P) — left: color 1, right: color 2">
          <svg viewBox="0 0 20 20"><path d="M3 17l1-4 9-9 3 3-9 9z M11 6l3 3"/></svg></button>
        <button data-tool="brush" title="Brush (B)">
          <svg viewBox="0 0 20 20"><path d="M17 3l-7 8 M8 11c-2 0-3.5 1.5-3.5 3S3.5 16.5 2.5 17c3.5 1 7.5-.5 7.5-3.5z"/></svg></button>
        <button data-tool="eraser" title="Eraser (E) — erases to transparency">
          <svg viewBox="0 0 20 20"><path d="M3 13l7-7 6 6-5 5H7z M6.5 9.5l6 6 M9 17h8"/></svg></button>
        <button data-tool="fill" title="Fill (G)">
          <svg viewBox="0 0 20 20"><path d="M3 9l6-6 7 7-6 6z M3 9h13 M17 13c0 1.5 1 2.2 1 3.2a1 1 0 0 1-2 0c0-1 1-1.7 1-3.2z"/></svg></button>
        <button data-tool="eyedropper" title="Color picker (I) — left: color 1, right: color 2">
          <svg viewBox="0 0 20 20"><path d="M12 4l4 4 M14 2.5l3.5 3.5-2.5 2.5-3.5-3.5z M12.5 6.5L5 14v2.5h2.5L15 9"/></svg></button>
        <button data-tool="text" title="Text (T) — click, type, Enter">
          <svg viewBox="0 0 20 20"><path d="M4 5V3.5h12V5 M10 3.5V17 M7 17h6"/></svg></button>
        <button data-tool="line" title="Line (L) — Shift snaps to 45°">
          <svg viewBox="0 0 20 20"><path d="M3.5 16.5l13-13"/></svg></button>
        <button data-tool="rect" title="Rectangle (R) — Shift for a square">
          <svg viewBox="0 0 20 20"><rect x="3" y="5" width="14" height="10"/></svg></button>
        <button data-tool="ellipse" title="Ellipse (O) — Shift for a circle">
          <svg viewBox="0 0 20 20"><ellipse cx="10" cy="10" rx="7" ry="5"/></svg></button>
      </div>

      <div class="tool-options">
        <label class="opt" data-tools="pencil brush eraser line rect ellipse text">
          <span id="size-caption">Size</span>
          <input type="range" id="size" min="1" max="50" value="3">
          <output id="size-value">3</output>
        </label>
        <fieldset class="opt" data-tools="rect ellipse">
          <legend>Shape</legend>
          <label><input type="radio" name="shape-mode" value="outline" checked> Outline</label>
          <label><input type="radio" name="shape-mode" value="filled"> Filled</label>
          <label><input type="radio" name="shape-mode" value="both"> Outline + fill</label>
        </fieldset>
        <label class="opt" data-tools="fill">
          <span>Tolerance</span>
          <input type="range" id="fill-tolerance" min="0" max="100" value="10">
          <output id="fill-tolerance-value">10</output>
        </label>
      </div>
    </aside>

    <section class="workspace" id="workspace">
      <div class="stage" id="stage">
        <canvas id="doc"></canvas>
        <canvas id="overlay"></canvas>
        <div id="selection-box" hidden></div>
      </div>
    </section>
  </div>

  <footer class="colorbar">
    <div class="slots">
      <button class="slot checker" id="slot-secondary" title="Color 2 (right button) — click to edit"><span></span></button>
      <button class="slot checker" id="slot-primary" title="Color 1 (left button) — click to edit"><span></span></button>
      <button class="swap" data-action="swap" title="Swap colors (X)">⇄</button>
    </div>
    <div class="color-edit">
      <span id="active-slot-label">Color 1</span>
      <input type="color" id="color-input" value="#000000" title="Edit the color">
      <code id="color-hex">#000000</code>
      <label title="Opacity — 0% paints transparency">
        Opacity <input type="range" id="alpha-input" min="0" max="255" value="255">
        <output id="alpha-value">100%</output>
      </label>
    </div>
    <div class="palette" id="palette" title="Left click: color 1 — right click: color 2"></div>
  </footer>

  <div class="statusbar">
    <span id="status-pos"></span>
    <span id="status-size"></span>
    <span id="status-msg" class="msg"></span>
  </div>

  <input type="file" id="file-input" accept="image/*" hidden>

  <!-- Remove background: step 1 shows the detected color, confirming performs step 2 -->
  <dialog id="bg-dialog" class="dialog">
    <form method="dialog">
      <h2>Remove background</h2>
      <p class="steps"><span class="step current">1. Check the color</span> <span class="step">2. Remove it</span></p>
      <div class="bg-result">
        <div class="bg-sample checker"><div id="bg-sample-color"></div></div>
        <div class="bg-facts">
          <div class="bg-hex" id="bg-hex">#FFFFFF</div>
          <div id="bg-rgb">rgb(255, 255, 255)</div>
          <div id="bg-source" class="muted"></div>
          <div id="bg-confidence" class="muted"></div>
        </div>
      </div>
      <p id="bg-warning" class="warning" hidden></p>
      <p class="question" id="bg-question">Is this the color of the image's background?</p>

      <details class="bg-options">
        <summary>Removal options</summary>
        <label class="row">
          Tolerance
          <input type="range" id="bg-tolerance" min="0" max="60" value="10">
          <output id="bg-tolerance-value">10</output>
        </label>
        <p class="hint">How far a pixel's color may be from the background color and still be removed.</p>
        <label class="row"><input type="radio" name="bg-mode" value="connected" checked> Only background touching the image's edges</label>
        <label class="row"><input type="radio" name="bg-mode" value="global"> Every pixel of that color, holes inside objects too</label>
        <label class="row"><input type="checkbox" id="bg-soften" checked> Soften edges (subtract the color from the outline's anti-aliasing)</label>
      </details>

      <div class="actions">
        <button type="button" id="bg-pick">No, let me pick it in the image</button>
        <span class="spacer"></span>
        <button type="button" id="bg-cancel">Cancel</button>
        <button type="button" id="bg-confirm" class="accent">Yes, remove it</button>
      </div>
    </form>
  </dialog>

  <dialog id="new-dialog" class="dialog">
    <form method="dialog">
      <h2>New image</h2>
      <label class="row">Width <input type="number" id="new-width" min="1" max="10000" value="800"> px</label>
      <label class="row">Height <input type="number" id="new-height" min="1" max="10000" value="600"> px</label>
      <label class="row">Background
        <select id="new-bg">
          <option value="white">White</option>
          <option value="transparent">Transparent</option>
          <option value="secondary">Color 2</option>
        </select>
      </label>
      <div class="actions">
        <span class="spacer"></span>
        <button value="cancel">Cancel</button>
        <button value="ok" class="accent">Create</button>
      </div>
    </form>
  </dialog>

  <dialog id="resize-dialog" class="dialog">
    <form method="dialog">
      <h2>Resize</h2>
      <label class="row">Width <input type="number" id="resize-width" min="1" max="10000"> px</label>
      <label class="row">Height <input type="number" id="resize-height" min="1" max="10000"> px</label>
      <label class="row"><input type="checkbox" id="resize-keep-ratio" checked> Keep aspect ratio</label>
      <label class="row"><input type="radio" name="resize-mode" value="scale" checked> Scale the image</label>
      <label class="row"><input type="radio" name="resize-mode" value="canvas"> Change the canvas only (new area is transparent)</label>
      <div class="actions">
        <span class="spacer"></span>
        <button value="cancel">Cancel</button>
        <button value="ok" class="accent">Resize</button>
      </div>
    </form>
  </dialog>

  <script src="js/bg-removal.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
