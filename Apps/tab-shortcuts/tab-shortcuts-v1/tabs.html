<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Tab Shortcuts</title>
  <link rel="stylesheet" href="tabs.css" />
</head>
<body>
  <form id="select-form" autocomplete="off">
    <input
      id="number-input"
      type="text"
      inputmode="numeric"
      pattern="[0-9]*"
      placeholder="Type a tab number and press Enter"
      autofocus
    />
  </form>
  <ol id="tab-list"></ol>
  <script src="tabs.js"></script>
</body>
</html>
