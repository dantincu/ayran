<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Glass body gradient: creamy white yogurt drink -->
    <linearGradient id="drink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#e8e0d5"/>
      <stop offset="40%"  stop-color="#f5f0ea"/>
      <stop offset="100%" stop-color="#d6cec4"/>
    </linearGradient>
    <!-- Foam gradient -->
    <linearGradient id="foam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ede8e2"/>
    </linearGradient>
    <!-- Glass wall sheen -->
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#c8d8e8" stop-opacity="0.55"/>
      <stop offset="30%"  stop-color="#ddeeff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#9ab8cc" stop-opacity="0.45"/>
    </linearGradient>
  </defs>

  <!-- ── Glass body (trapezoid: wider at top) ── -->
  <path d="M22 32 L25 88 Q25 92 30 92 L70 92 Q75 92 75 88 L78 32 Z"
        fill="url(#drink)" stroke="#9aacb8" stroke-width="1.5"/>

  <!-- ── Foam head ── -->
  <ellipse cx="50" cy="31" rx="28" ry="8" fill="url(#foam)" stroke="#c8bfb5" stroke-width="1"/>
  <!-- Foam texture bumps -->
  <ellipse cx="38" cy="29" rx="7"  ry="4.5" fill="#ffffff" opacity="0.8"/>
  <ellipse cx="53" cy="28" rx="8"  ry="4"   fill="#ffffff" opacity="0.7"/>
  <ellipse cx="64" cy="30" rx="5"  ry="3.5" fill="#ffffff" opacity="0.75"/>
  <ellipse cx="44" cy="33" rx="5"  ry="3"   fill="#f0ece7" opacity="0.6"/>

  <!-- ── Bubbles rising in the drink ── -->
  <circle cx="37" cy="70" r="2"   fill="#ffffff" opacity="0.55"/>
  <circle cx="52" cy="60" r="1.5" fill="#ffffff" opacity="0.50"/>
  <circle cx="44" cy="50" r="1"   fill="#ffffff" opacity="0.45"/>
  <circle cx="62" cy="75" r="1.5" fill="#ffffff" opacity="0.50"/>
  <circle cx="57" cy="52" r="1"   fill="#ffffff" opacity="0.40"/>
  <circle cx="34" cy="55" r="1"   fill="#ffffff" opacity="0.40"/>

  <!-- ── Glass wall sheen (overlay) ── -->
  <path d="M22 32 L25 88 Q25 92 30 92 L70 92 Q75 92 75 88 L78 32 Z"
        fill="url(#glass)"/>

  <!-- ── Salt crystals on foam rim ── -->
  <rect x="33" y="24" width="3" height="3" rx="0.5" fill="#ffffff" opacity="0.9" transform="rotate(15,34.5,25.5)"/>
  <rect x="55" y="23" width="3" height="3" rx="0.5" fill="#ffffff" opacity="0.85" transform="rotate(-10,56.5,24.5)"/>
  <rect x="46" y="21" width="2.5" height="2.5" rx="0.5" fill="#ffffff" opacity="0.8" transform="rotate(5,47.25,22.25)"/>

  <!-- ── Glass rim highlight ── -->
  <ellipse cx="50" cy="31" rx="28" ry="8"
           fill="none" stroke="#ddeeff" stroke-width="1" opacity="0.6"/>
</svg>
