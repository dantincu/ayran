[package]
name = "ayran-mailbox-tauriapp"
version = "0.1.0"
description = "Ayran Mailbox - a Gmail / Outlook / Yahoo mail client for desktop and mobile"
edition = "2021"

[lib]
# staticlib/cdylib are what the Android/iOS builds link; rlib is for the desktop binary and tests.
name = "ayran_mailbox_tauriapp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
regex = "1"
log = "0.4"

# Secrets at rest (secure_store.rs): AES-256-GCM, with the key in the OS key store.
aes-gcm = "0.11.1"
hex = "0.4"
# OAuth PKCE
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"

# Yahoo: IMAP + SMTP over TLS; MIME parsing and building for every provider.
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
futures = "0.3"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "ring", "webpki-roots", "hostname"] }
mail-parser = "0.11"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
keyring = "4.2.0"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[profile.release]
codegen-units = 1
lto = true
strip = true
